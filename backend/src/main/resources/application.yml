server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: smart-resume-analyzer-backend
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB
  datasource:
    url: jdbc:h2:file:./data/smartresume_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

# Application Specific Configurations
app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
  upload:
    dir: ./uploads/resumes
    allowed-types:
      - application/pdf
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
  ai:
    # Optional LLM API Key (e.g., OpenAI or Gemini). Fallback rule-based engine operates automatically when empty.
    api-key: ${AI_API_KEY:}
    api-url: ${AI_API_URL:https://api.openai.com/v1/chat/completions}
    model: ${AI_MODEL:gpt-4o-mini}
    enabled: true
